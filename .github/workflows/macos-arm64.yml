name: macOS arm64

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  cross-build:
    runs-on: ubuntu-latest
    container: ghcr.io/openxiangshan/xs-env:ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends file xz-utils

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Compile
        run: |
          mill -i design.compile

      - name: Generate Verilog
        run: |
          make

      - name: Copy the Profile File
        run: |
          mv build/generated-src/difftest_profile.json .
          make clean
          mkdir -p artifact

      - name: Generate EMU using Profile-Generated RTL
        run: |
          make PROFILE=./difftest_profile.json NUM_CORES=4
          make emu -j2 \
            WITH_CHISELDB=0 \
            WITH_CONSTANTIN=0 \
            NO_ZSTD_COMPRESSION=1 \
            IMAGE_GZ_COMPRESS=0 \
            IMAGE_ELF=0 \
            OPT_FAST=-O3 \
            VERILATOR_LDFLAGS=-pthread \
            UNAME_S=Darwin \
            CFG_LDFLAGS_VERILATED= \
            CFG_LDLIBS_THREADS=-pthread \
            LDFLAGS= \
            USER_CPPFLAGS=-DVL_TIME_CONTEXT \
            AR="zig ar" \
            CC="zig cc -target aarch64-macos-none -Wno-error=date-time" \
            CXX="zig c++ -target aarch64-macos-none -Wno-error=date-time" \
            LINK="zig c++ -target aarch64-macos-none"
          cp build/verilator-compile/emu artifact/difftest-emu-default
          file_description=$(file artifact/difftest-emu-default)
          echo "$file_description"
          printf '%s\n' "$file_description" | grep -Fq "Mach-O 64-bit"
          printf '%s\n' "$file_description" | grep -Eq "arm64|aarch64"
          make clean

      - name: Generate EMU with Squash
        run: |
          make PROFILE=./difftest_profile.json NUM_CORES=4 CONFIG=S
          make emu -j2 \
            WITH_CHISELDB=0 \
            WITH_CONSTANTIN=0 \
            NO_ZSTD_COMPRESSION=1 \
            IMAGE_GZ_COMPRESS=0 \
            IMAGE_ELF=0 \
            OPT_FAST=-O3 \
            VERILATOR_LDFLAGS=-pthread \
            UNAME_S=Darwin \
            CFG_LDFLAGS_VERILATED= \
            CFG_LDLIBS_THREADS=-pthread \
            LDFLAGS= \
            USER_CPPFLAGS=-DVL_TIME_CONTEXT \
            AR="zig ar" \
            CC="zig cc -target aarch64-macos-none -Wno-error=date-time" \
            CXX="zig c++ -target aarch64-macos-none -Wno-error=date-time" \
            LINK="zig c++ -target aarch64-macos-none"
          cp build/verilator-compile/emu artifact/difftest-emu-squash
          file_description=$(file artifact/difftest-emu-squash)
          echo "$file_description"
          printf '%s\n' "$file_description" | grep -Fq "Mach-O 64-bit"
          printf '%s\n' "$file_description" | grep -Eq "arm64|aarch64"
          make clean

      - name: Generate EMU with SoftArchUpdate
        run: |
          make PROFILE=./difftest_profile.json NUM_CORES=4 CONFIG=U
          make emu -j2 \
            WITH_CHISELDB=0 \
            WITH_CONSTANTIN=0 \
            NO_ZSTD_COMPRESSION=1 \
            IMAGE_GZ_COMPRESS=0 \
            IMAGE_ELF=0 \
            OPT_FAST=-O3 \
            VERILATOR_LDFLAGS=-pthread \
            UNAME_S=Darwin \
            CFG_LDFLAGS_VERILATED= \
            CFG_LDLIBS_THREADS=-pthread \
            LDFLAGS= \
            USER_CPPFLAGS=-DVL_TIME_CONTEXT \
            AR="zig ar" \
            CC="zig cc -target aarch64-macos-none -Wno-error=date-time" \
            CXX="zig c++ -target aarch64-macos-none -Wno-error=date-time" \
            LINK="zig c++ -target aarch64-macos-none"
          cp build/verilator-compile/emu artifact/difftest-emu-soft-arch-update
          file_description=$(file artifact/difftest-emu-soft-arch-update)
          echo "$file_description"
          printf '%s\n' "$file_description" | grep -Fq "Mach-O 64-bit"
          printf '%s\n' "$file_description" | grep -Eq "arm64|aarch64"
          make clean

      - name: Clean the Profile File
        run: |
          rm -f ./difftest_profile.json

      - name: Upload emulator
        uses: actions/upload-artifact@v7
        with:
          name: difftest-emu-macos-arm64
          path: artifact/difftest-emu-*
          retention-days: 3

  run:
    needs: cross-build
    runs-on: macos-15
    timeout-minutes: 5

    steps:
      - name: Download emulator
        uses: actions/download-artifact@v8
        with:
          name: difftest-emu-macos-arm64
          path: artifact

      - name: Verify Apple Silicon runner
        run: |
          test "$(uname -m)" = arm64

      - name: Verify default emulator
        run: |
          emulator=artifact/difftest-emu-default
          test -f "$emulator"
          chmod +x "$emulator"
          test "$(lipo -archs "$emulator")" = arm64
          otool -L "$emulator"

      - name: Run default emulator
        run: |
          set -o pipefail
          emulator=artifact/difftest-emu-default
          log=difftest-emu-default.log
          "$emulator" --no-diff --ram-size=128MB -C 0 | tee "$log"
          grep -Fq "Guest cycle spent: 1" "$log"
          for core in 0 1 2 3; do
            grep -Fq "Core-$core instrCnt = 0, cycleCnt = 0" "$log"
          done

      - name: Verify Squash emulator
        run: |
          emulator=artifact/difftest-emu-squash
          test -f "$emulator"
          chmod +x "$emulator"
          test "$(lipo -archs "$emulator")" = arm64
          otool -L "$emulator"

      - name: Run Squash emulator
        run: |
          set -o pipefail
          emulator=artifact/difftest-emu-squash
          log=difftest-emu-squash.log
          "$emulator" --no-diff --ram-size=128MB -C 0 | tee "$log"
          grep -Fq "Guest cycle spent: 1" "$log"
          for core in 0 1 2 3; do
            grep -Fq "Core-$core instrCnt = 0, cycleCnt = 0" "$log"
          done

      - name: Verify SoftArchUpdate emulator
        run: |
          emulator=artifact/difftest-emu-soft-arch-update
          test -f "$emulator"
          chmod +x "$emulator"
          test "$(lipo -archs "$emulator")" = arm64
          otool -L "$emulator"

      - name: Run SoftArchUpdate emulator
        run: |
          set -o pipefail
          emulator=artifact/difftest-emu-soft-arch-update
          log=difftest-emu-soft-arch-update.log
          "$emulator" --no-diff --ram-size=128MB -C 0 | tee "$log"
          grep -Fq "Guest cycle spent: 1" "$log"
          for core in 0 1 2 3; do
            grep -Fq "Core-$core instrCnt = 0, cycleCnt = 0" "$log"
          done
