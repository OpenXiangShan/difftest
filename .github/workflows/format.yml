name: format

on:
  pull_request:
    branches: [ master ]

jobs:
  format:
    runs-on: ubuntu-24.04
    container: ghcr.io/openxiangshan/xs-env:ubuntu-24.04-slim
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Clang Format Installation
        run: |
          python3 -m pip install --no-cache-dir \
            --target "$RUNNER_TEMP/clang-format" \
            clang-format==18.1.4
          echo "$RUNNER_TEMP/clang-format/clang_format/data/bin" >> "$GITHUB_PATH"

      - name: Scala Formatter
        run: |
          make scala-format

      - name: Clang Formatter
        run: |
          make clang-format

      - name: Format Check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Please run 'make format' manually"
            exit 1
          fi
